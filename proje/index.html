<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center h-screen">

<div class="bg-[#111827] p-6 rounded-xl w-80 text-center">
<h2 class="text-white text-xl mb-4">Giriş Yap</h2>

<input id="email" placeholder="email">
<input id="password" type="password" placeholder="şifre">

<button onclick="login()">Giriş Yap</button>
<button onclick="register()">Kayıt Ol</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4zA5XOubb9p_WJzrtCeQIvctJb0idIeM",
  authDomain: "proje-fa1a9.firebaseapp.com",
  projectId: "proje-fa1a9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, email.value, password.value);
    location.href="app.html";
  }catch{
    alert("Hatalı giriş");
  }
};
</script>
</body>
</html>
