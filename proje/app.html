<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>GTA Dialog AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f1a] text-white h-screen flex">

<!-- SOL -->
<div class="w-1/4 bg-[#111827] p-4">

<h2 class="mb-3">Diyalog</h2>

<textarea id="dialog" class="w-full h-40 p-2 bg-gray-800 rounded mb-4"
placeholder="Ali: Selam\nVeli: Naber"></textarea>

<button onclick="generateAI()" class="bg-purple-600 w-full p-2 rounded mb-2">
AI Üret
</button>

<button onclick="draw()" class="bg-green-600 w-full p-2 rounded">
Resme Yaz
</button>

</div>

<!-- SAĞ -->
<div class="flex-1 p-6">

<input type="file" id="upload" class="mb-4">

<canvas id="canvas" class="border border-gray-700 rounded"></canvas>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = null;

upload.onchange = e=>{
 const file = e.target.files[0];
 const i = new Image();
 i.onload = ()=>{
   canvas.width = i.width;
   canvas.height = i.height;
   ctx.drawImage(i,0,0);
   img = i;
 };
 i.src = URL.createObjectURL(file);
};

function draw(){
 if(!img) return;
 ctx.drawImage(img,0,0);

 ctx.fillStyle="white";
 ctx.font="28px Arial";

 const lines = document.getElementById("dialog").value.split("\\n");

 let y = 60;
 lines.forEach(line=>{
   ctx.fillText(line, 50, y);
   y += 40;
 });
}

async function generateAI(){

 const prompt = "kısa komik diyalog yaz 2 karakter arasında";

 const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
   method:"POST",
   headers:{
     "Authorization":"Bearer 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",
     "Content-Type":"application/json"
   },
   body:JSON.stringify({
     model:"openai/gpt-3.5-turbo",
     messages:[{role:"user",content:prompt}]
   })
 });

 const data = await res.json();
 document.getElementById("dialog").value = data.choices[0].message.content;
}
</script>

</body>
</html>
